<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0b1329"/>
    </linearGradient>

    <linearGradient id="primaryTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="nodeGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="nodeGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>

    <linearGradient id="nodeGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="badgeBorderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Filters for Glow Effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    @keyframes pulseFade {
      0%, 100% { opacity: 0.25; transform: scale(1); }
      50% { opacity: 0.65; transform: scale(1.08); }
    }
    @keyframes dashFlow {
      0% { stroke-dashoffset: 200; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes floatParticle {
      0%, 100% { transform: translateY(0px) translateX(0px); }
      50% { transform: translateY(-12px) translateX(8px); }
    }
    @keyframes gentlePulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.8; }
    }
    .pulse-node {
      animation: pulseFade 4s ease-in-out infinite;
      transform-origin: center;
    }
    .dash-line {
      stroke-dasharray: 8 12;
      animation: dashFlow 20s linear infinite;
    }
    .particle {
      animation: floatParticle 6s ease-in-out infinite;
    }
    .glow-core {
      animation: gentlePulse 3.5s ease-in-out infinite;
    }
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;
      font-weight: 800;
      letter-spacing: -0.025em;
    }
    .sub-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;
      font-weight: 400;
      letter-spacing: 0.01em;
    }
    .pill-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 13px;
    }
  </style>

  <!-- Background Canvas -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" stroke="#1f2937" stroke-width="2"/>

  <!-- Background Decorative Dynamic Network (Multi-Agent Swarm Nodes) -->
  <g opacity="0.35">
    <!-- Interconnecting Agent Graph Links -->
    <line x1="120" y1="80" x2="280" y2="140" stroke="#38bdf8" stroke-width="1.5" class="dash-line" opacity="0.4"/>
    <line x1="280" y1="140" x2="220" y2="280" stroke="#818cf8" stroke-width="1.5" class="dash-line" opacity="0.5"/>
    <line x1="120" y1="80" x2="220" y2="280" stroke="#0284c7" stroke-width="1" opacity="0.3"/>
    
    <line x1="940" y1="90" x2="1080" y2="160" stroke="#c084fc" stroke-width="1.5" class="dash-line" opacity="0.4"/>
    <line x1="1080" y1="160" x2="980" y2="290" stroke="#a855f7" stroke-width="1.5" class="dash-line" opacity="0.5"/>
    <line x1="940" y1="90" x2="980" y2="290" stroke="#7e22ce" stroke-width="1" opacity="0.3"/>

    <line x1="280" y1="140" x2="420" y2="70" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 6" opacity="0.25"/>
    <line x1="940" y1="90" x2="780" y2="60" stroke="#c084fc" stroke-width="1" stroke-dasharray="4 6" opacity="0.25"/>
    <line x1="220" y1="280" x2="460" y2="300" stroke="#10b981" stroke-width="1" stroke-dasharray="4 6" opacity="0.25"/>
    <line x1="980" y1="290" x2="740" y2="310" stroke="#10b981" stroke-width="1" stroke-dasharray="4 6" opacity="0.25"/>

    <!-- Left Swarm Clusters -->
    <circle cx="120" cy="80" r="28" fill="#38bdf8" opacity="0.12" class="pulse-node" style="animation-delay: 0s;"/>
    <circle cx="120" cy="80" r="8" fill="url(#nodeGrad1)"/>
    <circle cx="120" cy="80" r="4" fill="#ffffff" class="glow-core"/>

    <circle cx="280" cy="140" r="32" fill="#818cf8" opacity="0.15" class="pulse-node" style="animation-delay: 1.2s;"/>
    <circle cx="280" cy="140" r="10" fill="url(#nodeGrad2)"/>
    <circle cx="280" cy="140" r="4.5" fill="#ffffff" class="glow-core"/>

    <circle cx="220" cy="280" r="24" fill="#10b981" opacity="0.15" class="pulse-node" style="animation-delay: 2.1s;"/>
    <circle cx="220" cy="280" r="7" fill="url(#nodeGrad3)"/>
    <circle cx="220" cy="280" r="3" fill="#ffffff"/>

    <circle cx="420" cy="70" r="5" fill="#38bdf8" opacity="0.5" class="particle"/>
    <circle cx="460" cy="300" r="4" fill="#10b981" opacity="0.5" class="particle" style="animation-delay: 1.5s;"/>

    <!-- Right Swarm Clusters -->
    <circle cx="940" cy="90" r="30" fill="#c084fc" opacity="0.15" class="pulse-node" style="animation-delay: 0.8s;"/>
    <circle cx="940" cy="90" r="9" fill="url(#nodeGrad2)"/>
    <circle cx="940" cy="90" r="4" fill="#ffffff" class="glow-core"/>

    <circle cx="1080" cy="160" r="36" fill="#38bdf8" opacity="0.12" class="pulse-node" style="animation-delay: 2.5s;"/>
    <circle cx="1080" cy="160" r="11" fill="url(#nodeGrad1)"/>
    <circle cx="1080" cy="160" r="5" fill="#ffffff" class="glow-core"/>

    <circle cx="980" cy="290" r="26" fill="#10b981" opacity="0.15" class="pulse-node" style="animation-delay: 1.7s;"/>
    <circle cx="980" cy="290" r="8" fill="url(#nodeGrad3)"/>
    <circle cx="980" cy="290" r="3.5" fill="#ffffff"/>

    <circle cx="780" cy="60" r="5" fill="#c084fc" opacity="0.5" class="particle" style="animation-delay: 2s;"/>
    <circle cx="740" cy="310" r="4.5" fill="#38bdf8" opacity="0.5" class="particle" style="animation-delay: 0.5s;"/>
  </g>

  <!-- Central Ambient Radial Glow -->
  <ellipse cx="600" cy="180" rx="360" ry="130" fill="#38bdf8" opacity="0.06" filter="url(#softGlow)"/>
  <ellipse cx="600" cy="180" rx="220" ry="80" fill="#818cf8" opacity="0.08" filter="url(#glow)"/>

  <!-- Foreground Content: Strict Top Z-Index / High Contrast -->
  <g id="foreground-content">
    <!-- Category Mini-Pill Header -->
    <g transform="translate(600, 72)">
      <rect x="-140" y="-14" width="280" height="28" rx="14" fill="#1e293b" stroke="url(#badgeBorderGrad)" stroke-width="1.2"/>
      <text x="0" y="5" text-anchor="middle" fill="#93c5fd" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" letter-spacing="0.08em">
        ⚡ AUTONOMOUS AGENT ECOSYSTEM
      </text>
    </g>

    <!-- Main Title -->
    <text x="600" y="148" text-anchor="middle" class="title-text" font-size="46" fill="url(#primaryTextGrad)" filter="url(#glow)">
      Awesome Multi-Agent Frameworks
    </text>
    <text x="600" y="148" text-anchor="middle" class="title-text" font-size="46" fill="#ffffff">
      Awesome Multi-Agent Frameworks
    </text>

    <!-- Subtitle -->
    <text x="600" y="196" text-anchor="middle" class="sub-text" font-size="18" fill="#94a3b8">
      Curated Directory of Autonomous AI Agents, Swarms &amp; Multi-Agent Orchestration Frameworks
    </text>

    <!-- Feature Tags Row -->
    <g transform="translate(600, 260)">
      <!-- Tag 1 -->
      <g transform="translate(-330, 0)">
        <rect x="-75" y="-16" width="150" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="0" y="5" text-anchor="middle" fill="#38bdf8" class="pill-text">🤖 Role-Based Crews</text>
      </g>
      <!-- Tag 2 -->
      <g transform="translate(-110, 0)">
        <rect x="-75" y="-16" width="150" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="0" y="5" text-anchor="middle" fill="#a855f7" class="pill-text">🕸️ State Graphs</text>
      </g>
      <!-- Tag 3 -->
      <g transform="translate(110, 0)">
        <rect x="-75" y="-16" width="150" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="0" y="5" text-anchor="middle" fill="#34d399" class="pill-text">⚡ Swarm Protocols</text>
      </g>
      <!-- Tag 4 -->
      <g transform="translate(330, 0)">
        <rect x="-75" y="-16" width="150" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="0" y="5" text-anchor="middle" fill="#fbbf24" class="pill-text">🛡️ Tracing &amp; Evals</text>
      </g>
    </g>

    <!-- Bottom Metric / Star Counter Footnote -->
    <text x="600" y="325" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" fill="#64748b" letter-spacing="0.05em">
      PRODUCTION ARCHITECTURES • BENCHMARKS • SAAS &amp; OPEN-SOURCE SOLUTIONS
    </text>
  </g>
</svg>
